<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">

  <!-- Coffee cherry branch with 2 cherries and a leaf -->
  <symbol id="icon-coffee-cherry" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main branch -->
    <path d="M4 20 C6 16 8 14 12 12 C16 10 18 8 20 4"/>
    <!-- Left lateral branch -->
    <path d="M10 15 C9 13 9 11 10 10"/>
    <!-- Right lateral branch -->
    <path d="M15 11 C14 9 14 7 15 6"/>
    <!-- Cherry 1 (on left branch) -->
    <circle cx="9" cy="9.5" r="1.6"/>
    <!-- Cherry 2 (on right branch) -->
    <circle cx="15.5" cy="5" r="1.6"/>
    <!-- Leaf -->
    <path d="M12 12 C11 10 12 7 14 6.5 C13 8.5 13 10.5 12 12Z"/>
  </symbol>

  <!-- Mountain silhouette — Mt. Kalatungan style gentle peaks -->
  <symbol id="icon-mountain" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Far left gentle hill -->
    <path d="M1 19 L5 13 L9 17"/>
    <!-- Central main peak -->
    <path d="M7 19 L12 7 L17 19"/>
    <!-- Right secondary peak -->
    <path d="M15 19 L19 12 L23 19"/>
    <!-- Horizon baseline -->
    <line x1="1" y1="19" x2="23" y2="19"/>
    <!-- Snow cap hint on main peak -->
    <path d="M10.5 11.5 L12 7 L13.5 11.5"/>
  </symbol>

  <!-- Single organic leaf with center vein -->
  <symbol id="icon-leaf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Leaf outline -->
    <path d="M12 21 C7 17 4 12 5 7 C8 4 13 4 17 6 C20 10 19 16 12 21Z"/>
    <!-- Center vein -->
    <path d="M12 21 C12 16 11 11 10 7"/>
    <!-- Side veins -->
    <path d="M11 14 C9.5 13 8.5 12 8 10.5"/>
    <path d="M11.5 10.5 C10 10 9 9 8.5 7.5"/>
  </symbol>

  <!-- Coffee bean — oval with center crease line -->
  <symbol id="icon-bean" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bean outline (slightly tilted oval) -->
    <ellipse cx="12" cy="12" rx="5.5" ry="8" transform="rotate(-15 12 12)"/>
    <!-- Center crease -->
    <path d="M9 6.5 C10 9 10 14 9.5 17.5" transform="rotate(-15 12 12) translate(2 0)"/>
  </symbol>

  <!-- Seedling — small sprout with 2 leaves -->
  <symbol id="icon-seedling" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Stem -->
    <path d="M12 21 L12 11"/>
    <!-- Left leaf -->
    <path d="M12 14 C10 13 7 11 7 8 C9 7 12 9 12 11"/>
    <!-- Right leaf -->
    <path d="M12 11 C12 9 14 7 17 8 C16 11 13 13 12 14"/>
    <!-- Soil mound -->
    <path d="M8 21 C9 20 11 20 12 21 C13 20 15 20 16 21"/>
  </symbol>

</svg>
